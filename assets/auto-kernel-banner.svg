<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">auto-kernel banner</title>
  <desc id="desc">A banner for the auto-kernel repository showing a GPU optimization loop.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1220" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="glow" x1="160" y1="180" x2="980" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="154" r="128" fill="#38BDF8" opacity="0.12" filter="url(#soft)"/>
  <circle cx="240" cy="488" r="142" fill="#22C55E" opacity="0.12" filter="url(#soft)"/>

  <rect x="66" y="70" width="1148" height="500" rx="26" fill="#0F172A" stroke="#1E293B"/>

  <text x="112" y="176" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="76" font-weight="700">auto-kernel</text>
  <text x="114" y="228" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28">Workload-first GPU kernel optimization for PyTorch</text>

  <g transform="translate(112 292)">
    <rect width="210" height="76" rx="18" fill="#111827" stroke="#334155"/>
    <text x="28" y="31" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">profile.py</text>
    <text x="28" y="55" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">rank bottlenecks</text>
  </g>

  <g transform="translate(368 292)">
    <rect width="210" height="76" rx="18" fill="#111827" stroke="#334155"/>
    <text x="31" y="31" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">extract.py</text>
    <text x="31" y="55" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">activate kernel.py</text>
  </g>

  <g transform="translate(624 292)">
    <rect width="210" height="76" rx="18" fill="#111827" stroke="#334155"/>
    <text x="37" y="31" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">bench.py</text>
    <text x="37" y="55" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">test correctness</text>
  </g>

  <g transform="translate(880 292)">
    <rect width="224" height="76" rx="18" fill="#111827" stroke="#334155"/>
    <text x="24" y="31" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">verify.py</text>
    <text x="24" y="55" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">measure real impact</text>
  </g>

  <path d="M322 330H368" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M578 330H624" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M834 330H880" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>

  <rect x="112" y="430" width="992" height="86" rx="20" fill="#0B1220" stroke="#23314B"/>
  <text x="144" y="482" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">One active file. Ranked bottlenecks. Saved optimized variants.</text>
  <text x="144" y="510" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Optimize the hot path without losing the workload-level picture.</text>
</svg>
